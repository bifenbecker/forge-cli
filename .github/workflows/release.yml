# Publishes a merged release request: tags the "chore(release): <tag>" commit and creates the
# GitHub release from its CHANGELOG section. A manual run retries a publish that failed.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Identify the tagger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just release-publish
