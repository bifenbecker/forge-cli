# Project declarations: everything the scripts need that differs between projects.
# Read with `sh scripts/workflow.sh get <dotted.key> [default]`. Values stay on one line.

[git]
default_branch  = "main"
branch_template = "{type}/{ticket}-{slug}"
default_type    = "feature"
squash          = true
delete_branch   = true

[release]
version_pattern = '[0-9]+\.[0-9]+\.[0-9]+'
tag_template    = "v{version}"
current         = 'cat VERSION'                          # prints the current version
bump            = 'printf "%s\n" {version} > VERSION'    # sets it; {version} is substituted

[board]
kind      = "github"          # github | gitlab: titles come from `forge issue view`; else pass TITLE=
url       = "https://github.com/bifenbecker/forge-cli"
project   = "#"
issue_uri = "/issues/{ticket}"

[tools]
forge = "sh bin/forge"        # this repository runs its own working tree; elsewhere: "forge"

[checks]
# Names of `runner` recipes. pre_push runs from the prek hook.
runner   = "just"
static   = ["lint"]
pre_push = ["lint"]

[ship]
check          = "just check"
compose_model  = "sonnet"
conflict_paths = []            # dirs where two branches each adding a file conflict, e.g. migrations

[review]
language       = "ru"
confidence_min = 70
density_lines  = 35   # roughly one finding per N reviewed diff lines

[review.shallow]
# Harder to please than the deep pass: what it reports is fixed on the spot.
confidence_min = 80
density_lines  = 50
model          = "sonnet"
findings       = 10

[review.deep]
summary             = "edit"
max_inline_comments = 10
blocking_only_from  = 3
loop_max_iterations = 5
model               = "sonnet"

# One section per role in docs/review.md. A role named there and missing here has no model to run on.
[review.deep.roles.engineer]
model    = "sonnet"
findings = 5

[review.deep.roles.team_lead]
model    = "sonnet"
findings = 3

[worktree]
dir            = ".worktrees"
link           = []            # paths linked from the main checkout, e.g. [".env", ".venv"]
install        = ""            # run inside a new worktree, e.g. "just install"; empty: nothing
max_diff_lines = 600
diff_paths     = ["bin", "lib", "scripts"]
